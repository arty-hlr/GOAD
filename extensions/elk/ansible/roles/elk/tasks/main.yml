---
# Deploy the ELK stack as the elastic-container docker stack (Elasticsearch 9.x,
# Kibana, Fleet) - mirrors the BASE-EDR-Elastic VM from the EDR lab.
- name: Install docker and tooling (Ubuntu repositories)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - git
      - curl
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Clone elastic-container (pinned, first run only)
  ansible.builtin.git:
    repo: https://github.com/peasead/elastic-container
    dest: "{{ elastic_container_dir }}"
    version: "{{ elastic_container_version }}"
    update: no
  become: yes

- name: Customize elastic-container .env (upstream defaults preserved)
  ansible.builtin.lineinfile:
    path: "{{ elastic_container_dir }}/.env"
    regexp: "^{{ item.key }}=.*"
    line: "{{ item.key }}={{ item.value }}"
  become: yes
  loop:
    - { key: ELASTIC_PASSWORD, value: "{{ elastic_password }}" }
    - { key: KIBANA_PASSWORD, value: "{{ kibana_password }}" }
    - { key: STACK_VERSION, value: "{{ elastic_stack_version }}" }
    - { key: LICENSE, value: "{{ elastic_license }}" }
    - { key: MEM_LIMIT, value: "{{ elastic_mem_limit }}" }
  no_log: true

- name: Check whether the stack images are already staged
  ansible.builtin.command: docker image inspect docker.elastic.co/elasticsearch/elasticsearch:{{ elastic_stack_version }}
  register: es_image
  failed_when: false
  changed_when: false

- name: Stage the stack (pull images and packages)
  ansible.builtin.command: ./elastic-container.sh stage
  args:
    chdir: "{{ elastic_container_dir }}"
  become: yes
  async: 1800
  poll: 30
  changed_when: true
  when: es_image.rc != 0

- name: Start the stack
  ansible.builtin.command: ./elastic-container.sh start
  args:
    chdir: "{{ elastic_container_dir }}"
  become: yes
  async: 3600
  poll: 60
  changed_when: true

- name: Wait for the Elasticsearch API
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 9200
    timeout: 900

- name: Expose stack credentials to the logs_windows role
  ansible.builtin.set_fact:
    elk_api_host: "{{ ansible_host }}"
    elk_api_password: "{{ elastic_password }}"
