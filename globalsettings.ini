[all:vars]
; This is the global inventory file, data here will override all lab or provider inventory datas
; modify this to add layouts to VMs
; https://learn.microsoft.com/en-us/windows-hardware/manufacture/desktop/windows-language-pack-default-values
; French  : 0000040C
; US      : 00000409
; German  : 00000407
; Spanish : 0000040A
; the first in the list will be the default layout (here: FR | US)
keyboard_layouts=["00000409"]

; Uncoment to not use SSL in ansible (usefull if you get Digest initialization failed: initialization error with vagrant)
ansible_connection=ssh
ansible_shell_type=powershell
ansible_shell_executable=powershell.exe
ansible_user=goadsvc
ansible_password=G0adTransport!2026

; modify this to add a default route
add_route=no
route_gateway=192.168.56.1
route_network=10.0.0.0/8

; modify this to enable http proxy
enable_http_proxy=no
proxy_ip=x.x.x.x
proxy_port=8080
ad_http_proxy="http://{{proxy_ip}}:{{proxy_port}}"
ad_https_proxy="http://{{proxy_ip}}:{{proxy_port}}"

; dns server fallback forwarder
;dns_server_forwarder=1.1.1.1

; localhost (wait5m.yml) must stay local even with a non-winrm transport
[localhost_override]
localhost ansible_connection=local ansible_shell_type=sh ansible_shell_executable=/bin/bash ansible_python_interpreter=/usr/bin/python3

; linux extension VMs need a POSIX shell - the windows powershell default would break module exec
[linux_extension_override]
elk ansible_shell_type=sh ansible_shell_executable=/bin/bash ansible_python_interpreter=/usr/bin/python3
wazuh ansible_shell_type=sh ansible_shell_executable=/bin/bash ansible_python_interpreter=/usr/bin/python3
lx01 ansible_shell_type=sh ansible_shell_executable=/bin/bash ansible_python_interpreter=/usr/bin/python3
